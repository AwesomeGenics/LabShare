{% extends "base.html" %}{% block title %}List equipment{% endblock %}{% block topbar_title %}List resource{% endblock %}{% block content %}<section class="page"><h2>List a resource</h2>{% if error %}<div class="panel" style="color:var(--err)">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('catalog.new_resource') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="field"><span>Name</span><input name="name" required placeholder="Instrument or facility"></label><label class="field"><span>Category</span><select name="category" required><option value="">Choose a category</option>{% for cat in categories %}<option value="{{ cat.value }}">{{ cat.value }}</option>{% endfor %}</select></label><label class="field"><span>College location</span><input name="location" required placeholder="Building, campus"></label><label class="field"><span>Hourly rate (₹)</span><input type="number" name="hourly_price" min="0" step="0.01" required></label><label class="field"><span>Deposit (₹)</span><input type="number" name="deposit" min="0" step="0.01" value="0"></label><label class="field"><span>Usage conditions</span><textarea name="conditions" rows="3" placeholder="Training or safety requirements"></textarea></label><button class="btn btn-fill full">Publish listing</button></form></section>{% endblock %}
