{% extends "base.html" %}{% block title %}Report issue{% endblock %}{% block topbar_title %}Report issue{% endblock %}{% block content %}<section class="page"><h2>Report an issue</h2><p class="muted">{{ booking.resource.name }} · {{ booking.resource.institution.name }}</p>{% if error %}<div class="panel" style="color:var(--err)">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" action="{{ url_for('custody.incident_view',booking_id=booking.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="field"><span>Issue type</span><select name="incident_type" required><option value="">Select</option><option value="delay">Delay</option><option value="damage">Damage</option><option value="failure">Equipment failure</option></select></label><label class="field"><span>What happened?</span><textarea name="damage_notes" rows="4" required maxlength="1000" placeholder="Describe the issue"></textarea></label><label class="field"><span>Photo (optional)</span><input type="file" name="incident_photo" accept=".jpg,.jpeg,.png,.webp"></label><button class="btn btn-fill full">Submit report</button></form></section>{% endblock %}
